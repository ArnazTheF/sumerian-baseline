[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sumbase"
version = "0.1.0"
description = "Бейзлайны для шумерского: OCR клинописи, транслитерация, перевод"
requires-python = ">=3.10"

[project.scripts]
sumbase = "sumbase.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
