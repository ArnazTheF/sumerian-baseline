task: mt
run_name: lite_mt_byt5_small
seed: 42
paths: {data_dir: data/lite/mt, output_dir: runs/lite_mt_byt5_small, raw_dir: data/raw}

data:
  source: cdli_github
  subset: UrIIILineByLine
  max_train: 5000
  max_valid: 300
  max_test: null          
  dedupe_train: true

model:
  name: google/byt5-small
  prefix: ""
  max_source_length: 96    
  max_target_length: 96

train:
  epochs: 10
  batch_size: 16
  grad_accum: 2            
  lr: 5.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.05
  label_smoothing: 0.1
  optim: adamw_torch
  precision: auto
  gradient_checkpointing: false
  max_vram_gb: 12          
  eval_strategy: epoch
  early_stopping_patience: 3
  metric_for_best: chrf
  max_valid_during_train: 300
  logging_steps: 50
  num_workers: 2
  report_to: tensorboard

generation: {num_beams: 4, train_eval_beams: 1, max_new_tokens: 96, batch_size: 64}
baselines: {zeroshot_model: praeclarum/cuneiform, zeroshot_prefix: "translate Sumerian to English: "}
