epochs: 20
batch_size: 32
grad_accum: 1
lr: 0.0005
weight_decay: 0.01
warmup_ratio: 0.05
scheduler: linear
optim: adamw_torch
label_smoothing: 0.1
precision: auto
gradient_checkpointing: false
eval_strategy: epoch
eval_steps: 500
early_stopping_patience: 3
metric_for_best: chrf
max_valid_during_train: 400
logging_steps: 50
num_workers: 2
report_to: tensorboard
